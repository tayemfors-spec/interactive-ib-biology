facts:
  - id: f1
    claim: The Earth formed about 4.54 billion years ago (±0.05 Ga).
    where: [ "index.mdx#early-earth", "visuals.yaml:timeline", "src/sims/models/a2-1-timeline.ts (earth)" ]
    confidence: high
    basis: Radiometric dating of meteorites and lunar samples (Dalrymple 2001, The age of the Earth in the twentieth century); standard geology texts
    status: checked
  - id: f2
    claim: Zircon crystals from Jack Hills, Western Australia, about 4.4 billion years old, have oxygen isotope ratios suggesting liquid water at the surface, so oceans may have existed by about 4.4 Ga.
    where: [ "src/sims/models/a2-1-timeline.ts (oceans)", "visuals.yaml:timeline", "index.mdx#early-earth (within a few hundred million years)" ]
    confidence: medium
    basis: Wilde et al. 2001 (Nature 409) and Mojzsis et al. 2001; widely cited but the interpretation of early water is still debated
    status: open
  - id: f3
    claim: The pre-biotic atmosphere had little or no free O₂ and therefore no ozone layer, so UV (including UV-C) reached the surface; it had much higher CO₂ (and probably CH₄) than today, giving a strong greenhouse effect.
    where: [ "index.mdx#early-earth", "index.mdx (mustKnow, mistakes)", "quiz.yaml:q1", "flashcards.yaml:c1" ]
    confidence: high
    basis: IB guide A2.1.1; Kasting 1993 (Science 259) on the early atmosphere; standard texts
    status: checked
  - id: f4
    claim: The young Sun was about 30% dimmer (about 70% of today's luminosity), and the greenhouse effect kept the early Earth warm despite this; whether the surface was warmer than today is debated.
    where: [ "index.mdx#early-earth", "quiz.yaml:q1 (option d)" ]
    confidence: medium
    basis: Faint young Sun paradox (Sagan & Mullen 1972; Feulner 2012, Rev. Geophys.). The IB guide states higher temperatures; page says "warm" and "kept the surface warm"
    status: open
  - id: f5
    claim: Organic molecules do not form spontaneously in today's environment because free O₂ would oxidize them and organisms would consume them.
    where: [ "index.mdx#early-earth", "flashcards.yaml:c2" ]
    confidence: high
    basis: Standard argument dating back to Darwin's 1871 "warm little pond" letter; Oparin 1924
    status: checked
  - id: f6
    claim: The pre-biotic soup hypothesis was proposed independently by Oparin and Haldane in the 1920s.
    where: [ "index.mdx#early-earth" ]
    confidence: high
    basis: Oparin 1924; Haldane 1929; standard history of science
    status: checked
  - id: f7
    claim: Viruses lack cytoplasm, ribosomes and their own metabolism, are replicated only inside host cells and are inert outside them; some (e.g. tobacco mosaic virus) can be crystallized.
    where: [ "index.mdx#living", "index.mdx (mistakes)", "quiz.yaml:q2", "flashcards.yaml:c4" ]
    confidence: high
    basis: Standard virology (Stanley 1935 crystallized TMV); IB guide A2.1.2
    status: checked
  - id: f8
    claim: Pasteur's experiments in the 1860s (swan-necked flasks) showed that microorganisms do not arise in sterile broth, refuting spontaneous generation.
    where: [ "index.mdx#challenge", "quiz.yaml:q3 (option a)" ]
    confidence: high
    basis: Pasteur 1861–1862; standard history of biology
    status: checked
  - id: f9
    claim: Catalysis, self-replication of molecules, self-assembly and compartmentalization were necessary for the first cells.
    where: [ "index.mdx#challenge", "index.mdx (mustKnow)", "flashcards.yaml:c5" ]
    confidence: high
    basis: IB guide A2.1.3
    status: checked
  - id: f10
    claim: The Miller–Urey experiment was carried out in 1952 by Stanley Miller in Harold Urey's laboratory at the University of Chicago and published in 1953.
    where: [ "index.mdx#miller-urey", "index.mdx (mustKnow)", "visuals.yaml:miller-urey" ]
    confidence: high
    basis: Miller 1953, Science 117:528; Bada & Lazcano 2003, Science 300:745
    status: checked
  - id: f11
    claim: The apparatus contained CH₄, NH₃ and H₂ with water vapour from a boiling flask, electric sparks between electrodes, a water-cooled condenser and a U-tube trap from which samples were taken; it ran for about a week.
    where: [ "index.mdx#miller-urey", "visuals.yaml:miller-urey", "src/anims/a2-1-miller-urey.astro", "flashcards.yaml:c7" ]
    confidence: high
    basis: Miller 1953, 1955 (J. Am. Chem. Soc. 77:2351)
    status: checked
  - id: f12
    claim: The water turned pink within a day and deep red (red-brown) by the end of the week.
    where: [ "index.mdx#miller-urey", "visuals.yaml:miller-urey" ]
    confidence: medium
    basis: Miller 1953 describes the solution as pink after the first day and deep red and turbid by the end of the week
    status: open
  - id: f13
    claim: Products were analysed by (paper) chromatography and included glycine and alanine among several amino acids, plus other organic compounds.
    where: [ "index.mdx#miller-urey", "visuals.yaml:miller-urey", "quiz.yaml:q4", "flashcards.yaml:c8" ]
    confidence: high
    basis: Miller 1953 identified glycine, α-alanine and β-alanine with confidence (aspartic acid and α-aminobutyric acid less certainly)
    status: checked
  - id: f14
    claim: Re-analysis in 2008 of Miller's stored 1950s samples found more than 20 amino acids.
    where: [ "index.mdx#miller-urey", "visuals.yaml:miller-urey" ]
    confidence: high
    basis: Johnson et al. 2008, Science 322:404 (22 amino acids in the volcanic-apparatus samples)
    status: checked
  - id: f15
    claim: The early atmosphere is now thought to have been only weakly reducing or neutral, mainly CO₂ and N₂ with water vapour, and such mixtures give far fewer amino acids in spark experiments.
    where: [ "index.mdx#miller-urey", "index.mdx (mustKnow, mistakes)", "visuals.yaml:miller-urey", "src/anims/a2-1-miller-urey.astro", "quiz.yaml:q4", "flashcards.yaml:c9" ]
    confidence: medium
    basis: Kasting 1993; Cleaves et al. 2008 (Orig. Life Evol. Biosph. 38) — neutral mixtures give low yields unless buffered; the composition is still debated
    status: open
  - id: f16
    claim: Spark-discharge amino acids are racemic (equal L and D), whereas proteins use L-amino acids.
    where: [ "index.mdx#miller-urey", "flashcards.yaml:c9" ]
    confidence: high
    basis: Standard prebiotic chemistry (abiotic synthesis is non-stereoselective)
    status: checked
  - id: f17
    claim: The Murchison meteorite (1969) contains dozens of amino acids formed without life.
    where: [ "index.mdx#miller-urey" ]
    confidence: high
    basis: Kvenvolden et al. 1970 (Nature 228); later work found more than 70 amino acids
    status: checked
  - id: f18
    claim: Fatty acids have one hydrocarbon chain and a carboxyl group; above a critical concentration they form micelles, and at pH near the apparent pKa of the membrane-bound acid (near neutral to slightly alkaline, depending on chain length) they form bilayer vesicles.
    where: [ "index.mdx#vesicles", "visuals.yaml:vesicles", "src/anims/a2-1-vesicles.*" ]
    confidence: medium
    basis: Hargreaves & Deamer 1978; Monnard & Deamer 2002; Szostak lab reviews (e.g. oleic acid vesicles at about pH 8.5)
    status: open
  - id: f19
    claim: Fatty acid vesicles form spontaneously, can grow by incorporating fatty acids and divide, and are permeable to nucleotides while retaining RNA.
    where: [ "index.mdx#vesicles", "visuals.yaml:vesicles", "quiz.yaml:q6" ]
    confidence: high
    basis: Hanczyc, Fujikawa & Szostak 2003 (Science 302); Zhu & Szostak 2009; Mansy et al. 2008 (Nature 454)
    status: checked
  - id: f20
    claim: Fatty acids occur in carbonaceous meteorites and are produced in laboratory simulations of hydrothermal conditions (Fischer–Tropsch-type synthesis).
    where: [ "index.mdx#vesicles" ]
    confidence: medium
    basis: Deamer 1985 (Nature 317, Murchison amphiphiles); McCollom et al. 1999 (Orig. Life Evol. Biosph. 29)
    status: checked
  - id: f21
    claim: Ribozymes were discovered in the early 1980s by Thomas Cech (self-splicing intron) and Sidney Altman (RNase P); Nobel Prize 1989.
    where: [ "index.mdx#rna-world" ]
    confidence: high
    basis: Kruger et al. 1982 (Cell 31); Guerrier-Takada et al. 1983 (Cell 35)
    status: checked
  - id: f22
    claim: The peptidyl transferase centre of the large ribosomal subunit is made of rRNA; the ribosome is a ribozyme that catalyses peptide bond formation.
    where: [ "index.mdx#rna-world", "index.mdx (mustKnow, mistakes)", "src/diagrams/a2-1-rna-world.astro", "quiz.yaml:q7", "flashcards.yaml:c13" ]
    confidence: high
    basis: Nissen et al. 2000 (Science 289); IB guide A2.1.6
    status: checked
  - id: f23
    claim: Lab-evolved polymerase ribozymes can copy RNA templates but none yet copies itself fully.
    where: [ "index.mdx#rna-world" ]
    confidence: medium
    basis: Johnston et al. 2001 (Science 292); Wochner et al. 2011; Attwater et al. 2018 (Nat. Chem.). Fast-moving field
    status: open
  - id: f24
    claim: ATP, NAD and coenzyme A contain ribonucleotide components, and deoxyribonucleotides are made from ribonucleotides by ribonucleotide reductase.
    where: [ "index.mdx#rna-world" ]
    confidence: high
    basis: Standard biochemistry (Berg, Tymoczko & Stryer)
    status: checked
  - id: f25
    claim: DNA is more stable than RNA because deoxyribose lacks the 2′-OH group and DNA is double-stranded.
    where: [ "index.mdx#rna-world", "quiz.yaml:q7 (option c)" ]
    confidence: high
    basis: Standard biochemistry (2′-OH enables RNA backbone hydrolysis)
    status: checked
  - id: f26
    claim: Plausible pre-biotic routes to some ribonucleotides (pyrimidines) have been found.
    where: [ "index.mdx#rna-world" ]
    confidence: high
    basis: Powner, Gerland & Sutherland 2009 (Nature 459)
    status: checked
  - id: f27
    claim: The genetic code is nearly universal (minor variants, e.g. in mitochondria), and genes for rRNA, ribosomal proteins, some RNA polymerase and ATP synthase subunits are shared across all three domains.
    where: [ "index.mdx#luca", "quiz.yaml:q8", "flashcards.yaml:c14", "src/diagrams/a2-1-luca.astro" ]
    confidence: high
    basis: Standard molecular biology; Woese 1990 (PNAS 87); Theobald 2010 (Nature 465) formal test of universal common ancestry
    status: checked
  - id: f28
    claim: LUCA probably had ribosomes, a membrane and a DNA genome.
    where: [ "index.mdx#luca" ]
    confidence: medium
    basis: Weiss et al. 2016; Moody et al. 2024 (Nat. Ecol. Evol. 8). Whether LUCA's genome was DNA, and the nature of its membrane, are still debated
    status: open
  - id: f29
    claim: Three-domain tree rooted between Bacteria and Archaea+Eukaryotes (as drawn in the LUCA figure).
    where: [ "src/diagrams/a2-1-luca.astro" ]
    confidence: medium
    basis: Woese et al. 1990; most rootings place LUCA between Bacteria and Archaea; current evidence favours eukaryotes arising from within Archaea (two-domain tree), which is consistent with the figure's topology
    status: open
  - id: f30
    claim: Fossil stromatolites in the Pilbara, Western Australia (Strelley Pool about 3.43 Ga; Dresser Formation about 3.48 Ga), are the oldest widely accepted fossils.
    where: [ "index.mdx#dating", "src/sims/models/a2-1-timeline.ts (stromatolites)", "flashcards.yaml:c15" ]
    confidence: high
    basis: Allwood et al. 2006 (Nature 441); Van Kranendonk et al. 2008; Djokic et al. 2017
    status: checked
  - id: f31
    claim: Organisms fix ¹²C slightly faster than ¹³C, so biologically fixed carbon has a low ¹³C/¹²C ratio; ¹³C is stable.
    where: [ "index.mdx#dating", "index.mdx (mistakes)", "quiz.yaml:q9", "flashcards.yaml:c15" ]
    confidence: high
    basis: Standard isotope geochemistry (Rubisco fractionation, δ¹³C about −20 to −30‰)
    status: checked
  - id: f32
    claim: ¹³C-depleted graphite in 3.7 Ga metasedimentary rocks from Isua, West Greenland, is evidence of life.
    where: [ "index.mdx#dating", "src/sims/models/a2-1-timeline.ts (isua)", "quiz.yaml:q9", "flashcards.yaml:c15" ]
    confidence: medium
    basis: Rosing 1999 (Science 283); Ohtomo et al. 2014 (Nat. Geosci. 7). Widely cited; some dispute. (The study guide's 3.8 Ga Akilia claim is more strongly disputed and is not used.)
    status: open
  - id: f33
    claim: A graphite inclusion in a 4.1 Ga Jack Hills zircon has a light carbon isotope signature; this is a single, disputed sample.
    where: [ "index.mdx#dating", "src/sims/models/a2-1-timeline.ts (jack-hills)" ]
    confidence: medium
    basis: Bell et al. 2015 (PNAS 112)
    status: open
  - id: f34
    claim: Molecular-clock estimates for LUCA range roughly from 3.9 to 4.3 Ga; a large 2024 study estimated about 4.2 Ga (4.09–4.33 Ga).
    where: [ "index.mdx#dating", "src/sims/models/a2-1-timeline.ts (luca)", "visuals.yaml:timeline" ]
    confidence: medium
    basis: Moody et al. 2024 (Nat. Ecol. Evol. 8:1654); Betts et al. 2018 (Nat. Ecol. Evol. 2). The study guide's "nearly 4.5 Ga" is not used
    status: open
  - id: f35
    claim: Great Oxidation Event about 2.4 Ga (roughly 2.45–2.32 Ga), caused by oxygen from cyanobacterial photosynthesis.
    where: [ "src/sims/models/a2-1-timeline.ts (goe)", "index.mdx#dating (24-hour clock)" ]
    confidence: high
    basis: Lyons, Reinhard & Planavsky 2014 (Nature 506); Poulton et al. 2021
    status: checked
  - id: f36
    claim: Eukaryotic microfossils are clearly present by about 1.6 Ga.
    where: [ "src/sims/models/a2-1-timeline.ts (eukaryotes)" ]
    confidence: medium
    basis: Miao et al. 2019 (Changcheng Group, about 1.63 Ga); Javaux & Knoll; older claims (about 1.8 Ga or earlier) are debated
    status: open
  - id: f37
    claim: Cambrian explosion begins about 539–541 Ma (rounded to 0.54 Ga); Homo sapiens about 300 000 years ago.
    where: [ "src/sims/models/a2-1-timeline.ts (cambrian, humans)", "index.mdx#dating" ]
    confidence: high
    basis: International Chronostratigraphic Chart (base of Cambrian 538.8 Ma); Hublin et al. 2017 (Jebel Irhoud)
    status: checked
  - id: f38
    claim: On a 24-hour clock of Earth history the oldest accepted fossils fall before 06:00, the GOE about 11:19, the Cambrian about 21:09, and Homo sapiens about 6 s before midnight.
    where: [ "index.mdx#dating", "src/sims/models/a2-1-timeline.ts (clock)" ]
    confidence: high
    basis: Arithmetic from the dates above (unit tested in tests/unit/a2-1.test.ts)
    status: checked
  - id: f39
    claim: Black smokers vent acidic fluid at about 350–400 °C rich in metal sulfides; alkaline vents such as Lost City (Mid-Atlantic Ridge, discovered 2000) vent fluid at about 40–90 °C, pH 9–11, rich in H₂ and CH₄ from serpentinization, building porous carbonate chimneys.
    where: [ "index.mdx#vents", "index.mdx (mustKnow, mistakes)", "src/diagrams/a2-1-vents.astro" ]
    confidence: high
    basis: Kelley et al. 2001 (Nature 412), 2005 (Science 307); Martin et al. 2008 (Nat. Rev. Microbiol. 6)
    status: checked
  - id: f40
    claim: Alkaline vent hypothesis — micropores as compartments, FeS minerals as catalysts resembling enzyme Fe–S clusters, natural H⁺ gradient across thin walls between alkaline fluid and more acidic CO₂-rich ocean.
    where: [ "index.mdx#vents", "src/diagrams/a2-1-vents.astro", "flashcards.yaml:c16" ]
    confidence: medium
    basis: Russell & Hall 1997; Martin & Russell 2003; Lane & Martin 2012 (Cell 151). A hypothesis, not established fact; the page presents it as such
    status: checked
  - id: f41
    claim: Possible microfossils (haematite tubes and filaments) in hydrothermal vent precipitates of the Nuvvuagittuq belt, Quebec, at least 3.77 Ga and possibly 4.28 Ga; biological origin disputed.
    where: [ "index.mdx#vents", "src/sims/models/a2-1-timeline.ts (vent-fossils)" ]
    confidence: medium
    basis: Dodd et al. 2017 (Nature 543); challenged e.g. by McMahon 2019 (abiotic filaments)
    status: open
  - id: f42
    claim: A 2016 genome comparison (about 6 million genes from bacteria and archaea) identified 355 protein families likely present in LUCA, indicating an anaerobic, H₂-dependent, CO₂- and N₂-fixing, thermophilic organism (including reverse gyrase).
    where: [ "index.mdx#vents", "quiz.yaml:q10", "flashcards.yaml:c16" ]
    confidence: high
    basis: Weiss et al. 2016 (Nat. Microbiol. 1:16116)
    status: checked
  - id: f43
    claim: Alternative hypothesis — origin in terrestrial hot springs or pools where wet–dry cycles promote polymerization.
    where: [ "index.mdx#vents" ]
    confidence: high
    basis: Damer & Deamer 2020 (Astrobiology 20)
    status: checked
