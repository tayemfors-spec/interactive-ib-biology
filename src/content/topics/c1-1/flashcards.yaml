cards:
  - id: c1
    level: SL
    front: Why do cells need enzymes?
    back: Without catalysts, most reactions at body temperature would be far too slow to sustain life. Enzymes speed them up enormously, and because each is specific, cells can control which reactions happen by controlling their enzymes.
  - id: c2
    level: SL
    front: What is metabolism, and why does it need so many different enzymes?
    back: The complex network of interdependent chemical reactions in an organism. Each enzyme is specific to one reaction (or a few similar ones), so almost every reaction needs its own enzyme.
  - id: c3
    level: SL
    front: Give two examples each of anabolism and catabolism.
    back: Anabolism — protein synthesis, glycogen formation, photosynthesis (condensation, building up). Catabolism — hydrolysis of macromolecules in digestion, oxidation of substrates in cell respiration (breaking down).
  - id: c4
    level: SL
    front: What gives an active site its properties?
    back: A few amino acids whose R-groups give it a shape and chemistry complementary to the substrate. Interactions throughout the whole folded protein hold these amino acids in the right positions.
  - id: c5
    level: SL
    front: Describe induced-fit binding.
    back: The active site is roughly complementary to the substrate. When the substrate binds, both the enzyme and the substrate change shape so they fit tightly, straining the substrate's bonds. Products are released and the enzyme returns to its original shape.
  - id: c6
    level: SL
    front: Why does an enzyme need molecular motion to work?
    back: The substrate and active site must collide, in the right orientation, before binding can happen. Random motion brings them together. Sometimes only one moves — large substrates may be fixed, and some enzymes are fixed in membranes.
  - id: c7
    level: SL
    front: What is denaturation and what causes it?
    back: A change in the 3D structure of a protein, caused by high temperature or extreme pH breaking the bonds that hold the fold. The active site changes shape, so the substrate no longer binds. Usually permanent; peptide bonds are not broken.
  - id: c8
    level: SL
    front: Explain the shape of the graph of rate against temperature.
    back: Rate rises to the optimum because molecules move faster and collide more often and with more energy. Above the optimum it falls steeply as the enzyme is denatured and active sites lose their shape.
  - id: c9
    level: SL
    front: Why does rate level off at high substrate concentrations?
    back: All the active sites are occupied at any moment (the enzyme is saturated), so extra substrate cannot increase the rate. Enzyme concentration now limits the rate.
  - id: c10
    level: SL
    front: Optimum pH of pepsin, salivary amylase and trypsin?
    back: Pepsin about pH 2 (stomach); salivary amylase about pH 7 (mouth); trypsin about pH 8 (small intestine).
  - id: c11
    level: SL
    front: How do you find the initial rate from a graph of product against time?
    back: Draw a tangent to the curve at time zero and calculate its gradient (change in product ÷ change in time), with units such as cm³ s⁻¹.
  - id: c12
    level: SL
    front: What does an enzyme do to the energy profile of a reaction?
    back: It lowers the activation energy (the peak above the substrate level). The energy of the substrate and products, and so the overall energy released, are unchanged.
  - id: c13
    level: AHL
    front: Intracellular vs extracellular enzyme reactions — examples?
    back: Intracellular — glycolysis in the cytoplasm and the Krebs cycle in the mitochondrial matrix. Extracellular — chemical digestion in the gut lumen by secreted enzymes such as amylase and pepsin.
  - id: c14
    level: AHL
    front: Why does metabolism always generate heat, and which animals rely on it?
    back: Energy transfers in metabolism are not 100% efficient, so some energy is always lost as heat. Mammals and birds (and some other animals) use it to keep their body temperature constant.
  - id: c15
    level: AHL
    front: Competitive vs non-competitive inhibition — effect of raising substrate concentration?
    back: Competitive (binds active site, e.g. statins on HMG-CoA reductase) — overcome by high substrate; same maximum rate. Non-competitive (binds allosteric site) — not overcome; maximum rate lower.
  - id: c16
    level: AHL
    front: How is the isoleucine pathway controlled?
    back: End-product inhibition. Isoleucine binds reversibly to the allosteric site of threonine deaminase, the first enzyme of the pathway, so the whole pathway stops when isoleucine is plentiful and restarts when it is used up.
  - id: c17
    level: AHL
    front: How does penicillin work, and how do bacteria become resistant?
    back: It binds covalently to the active site of transpeptidases (mechanism-based, irreversible), so peptidoglycan is not cross-linked and the cell wall is weak. Resistant bacteria have mutated transpeptidases whose active site penicillin cannot bind.
  - id: c18
    level: AHL
    front: Linear vs cyclical pathways — examples?
    back: Linear — glycolysis (glucose → pyruvate). Cyclical — the Krebs cycle (oxaloacetate regenerated) and the Calvin cycle (RuBP regenerated).
