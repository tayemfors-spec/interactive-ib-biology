facts:
  - id: f1
    claim: The α carbon of an amino acid is bonded to an amine group, a carboxyl group, a hydrogen atom and an R group; the 20 genetically coded amino acids differ only in their R groups.
    where: ["index.mdx#amino-acids", "quiz.yaml:q1", "flashcards.yaml:c1", "visuals.yaml:protein/amino-acids", "diagrams/b1-2-amino-acid"]
    confidence: high
    basis: Standard biochemistry (Berg, Biochemistry; Alberts); IB guide B1.2.1
    status: checked
  - id: f2
    claim: Proteins contain L-amino acids; glycine (R = H) is the only standard amino acid that is not chiral. The 3D models use the L form (amino-acid scene checked by hand with the CORN rule; the levels model uses the ideal Cβ position from N, Cα and C, checked in unit tests).
    where: ["index.mdx#amino-acids", "scenes/b1-2-amino-acid.ts", "scenes/b1-2-kit.ts", "tests/unit/b1-2.test.ts"]
    confidence: high
    basis: Berg, Biochemistry; chirality test in tests/unit/b1-2.test.ts
    status: checked
  - id: f3
    claim: A peptide bond forms by condensation between the carboxyl C of one amino acid and the amine N of the next; the water is made from the –OH of the carboxyl group and an H of the amine group. Hydrolysis reverses it.
    where: ["index.mdx#amino-acids", "index.mdx (mistakes)", "quiz.yaml:q2", "flashcards.yaml:c2", "flashcards.yaml:c3", "visuals.yaml:protein/amino-acids"]
    confidence: high
    basis: Standard biochemistry; IB guide B1.2.2
    status: checked
  - id: f4
    claim: The peptide bond (C–N, about 0.133 nm) is shorter than a C–N single bond because of partial double-bond character; drawn shorter in the 3D model.
    where: ["scenes/b1-2-amino-acid.ts"]
    confidence: high
    basis: Pauling; Berg, Biochemistry (peptide bond 1.32–1.33 Å vs Cα–N 1.46 Å)
    status: checked
  - id: f5
    claim: Nine amino acids are essential for adult humans; non-essential amino acids can be synthesized from other amino acids or metabolites.
    where: ["index.mdx#diet", "flashcards.yaml:c4"]
    confidence: high
    basis: WHO/FAO/UNU (2007) Protein and amino acid requirements in human nutrition; IB guide B1.2.3
    status: checked
  - id: f6
    claim: Cereals such as wheat and rice are relatively low in lysine; legumes (beans, lentils, peas) are relatively low in methionine (sulfur amino acids); soya and quinoa supply all essential amino acids in good amounts.
    where: ["index.mdx#diet", "quiz.yaml:q4", "flashcards.yaml:c5"]
    confidence: high
    basis: Standard nutrition texts; FAO protein quality (limiting amino acids)
    status: checked
  - id: f7
    claim: Plants can synthesize all 20 amino acids using carbon compounds from photosynthesis and nitrogen absorbed from the soil.
    where: ["index.mdx#diet"]
    confidence: high
    basis: Taiz & Zeiger, Plant Physiology
    status: checked
  - id: f8
    claim: With 20 amino acids there are 20ⁿ possible sequences of length n (400 dipeptides; 20¹⁰ ≈ 1.02 × 10¹³; 20¹⁰⁰ ≈ 1.3 × 10¹³⁰; 20⁴ = 160,000).
    where: ["index.mdx#variety", "quiz.yaml:q3", "flashcards.yaml:c6"]
    confidence: high
    basis: Arithmetic; IB guide B1.2.4
    status: checked
  - id: f9
    claim: "Polypeptide lengths: oxytocin 9; insulin 51 (A chain 21, B chain 30); hen egg-white lysozyme 129; haemoglobin α chain 141 and β chain 146; titin up to about 34,000 (human isoforms up to ~34,350)."
    where: ["index.mdx#variety", "index.mdx#quaternary", "visuals.yaml:protein/quaternary"]
    confidence: high
    basis: UniProt (P01178 oxytocin, P01308 insulin, P00698 lysozyme, P69905/P68871 haemoglobin, Q8WZ42 titin)
    status: checked
  - id: f10
    claim: Heat denatures proteins by increasing vibration that breaks hydrogen bonds and other weak interactions; heat denaturation is almost always irreversible; denatured proteins often become insoluble and aggregate (egg white turns opaque and solid).
    where: ["index.mdx#denaturation", "quiz.yaml:q5", "flashcards.yaml:c7", "flashcards.yaml:c8", "visuals.yaml:denaturation"]
    confidence: high
    basis: Standard biochemistry; IB guide B1.2.5
    status: checked
  - id: f11
    claim: Denaturation does not break peptide bonds; disulfide bonds usually survive heating and moderate pH change.
    where: ["index.mdx#denaturation", "index.mdx (mistakes)", "sims/models/b1-2-denaturation.ts"]
    confidence: high
    basis: Standard biochemistry (Anfinsen; Berg)
    status: checked
  - id: f12
    claim: Pepsin works at about pH 1.5–2 and is irreversibly denatured at neutral to alkaline pH. In the model it is half-denatured at about pH 6.4.
    where: ["index.mdx#denaturation", "sims/models/b1-2-denaturation.ts"]
    confidence: medium
    basis: Pepsin is stable to about pH 6 and irreversibly inactivated above about pH 7 (Piper & Fenton 1965; Lin et al.). Exact threshold depends on conditions.
    status: open
  - id: f13
    claim: Taq polymerase from Thermus aquaticus (isolated from hot springs in Yellowstone) works best at about 72–80 °C and survives repeated heating to about 95 °C (half-life ~40 min at 95 °C), which is why it is used in PCR.
    where: ["index.mdx#denaturation", "flashcards.yaml:c9", "sims/models/b1-2-denaturation.ts"]
    confidence: high
    basis: Brock & Freeze (1969); Saiki et al. (1988); Lawyer et al. (1993)
    status: checked
  - id: f14
    claim: Some archaea from deep-sea hydrothermal vents grow above 100 °C (e.g. Pyrolobus fumarii to 113 °C, Methanopyrus kandleri strain 116 to 122 °C). Thermophile proteins tend to have more ionic bonds (salt bridges), disulfide bonds and well-packed hydrophobic cores.
    where: ["index.mdx#denaturation", "flashcards.yaml:c9"]
    confidence: high
    basis: Takai et al. (2008) PNAS; Vieille & Zeikus (2001) Microbiol Mol Biol Rev
    status: checked
  - id: f15
    claim: Model temperatures and pH thresholds in the denaturation simulation (human enzyme half-denatured at 55 °C and outside pH ~4.2–9.8; Taq at ~99 °C) are illustrative.
    where: ["sims/models/b1-2-denaturation.ts", "visuals.yaml:denaturation"]
    confidence: medium
    basis: Typical mesophilic enzyme stability; shown on screen as a qualitative model
    status: open
