    claim: "R-group classes at pH 7 (Campbell scheme): non-polar Gly, Ala, Val, Leu, Ile, Met, Phe, Trp, Pro; polar Ser, Thr, Cys, Tyr, Asn, Gln; acidic Asp, Glu; basic Lys, Arg, His. Some texts class Gly, Cys, Tyr, His or Trp differently."
