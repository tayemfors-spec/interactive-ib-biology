  - id: f18
    claim: Anfinsen's ribonuclease experiments (denaturation with urea and β-mercaptoethanol, refolding to an active enzyme) showed the amino acid sequence determines conformation.
    where: ["index.mdx#primary-secondary"]
    confidence: high
