    status: checked
  - id: f20
    claim: "α-helix: right-handed, 3.6 residues per turn, rise 0.15 nm per residue (pitch 0.54 nm), C=O of residue i H-bonded to N–H of residue i + 4; R groups point outwards. The 3D model is built with φ = −57.8°, ψ = −47° and gives O···H = 2.05 Å for every i → i + 4 pair."
    where: ["index.mdx#primary-secondary", "quiz.yaml:q7", "flashcards.yaml:c12", "visuals.yaml:protein/levels", "tests/unit/b1-2.test.ts"]
    confidence: high
    basis: Pauling, Corey & Branson (1951); geometry checked in unit tests
    status: checked
  - id: f21
    claim: "β-pleated sheet: strands parallel or antiparallel, H-bonds between C=O and N–H of neighbouring strands, R groups alternately above and below, pleated at each α carbon. The model sheet is antiparallel (φ = −139°, ψ = +136.5°, strands 4.3 Å apart) with O···H ≈ 1.9–2.1 Å."
    where: ["index.mdx#primary-secondary", "quiz.yaml:q7", "flashcards.yaml:c12", "visuals.yaml:protein/levels", "tests/unit/b1-2.test.ts"]
    confidence: high
    basis: Pauling & Corey (1951); geometry checked in unit tests
    status: checked
  - id: f22
    claim: Tertiary structure is stabilized by hydrogen bonds, ionic bonds, disulfide bonds between cysteines and hydrophobic interactions; amine and carboxyl groups in R groups become charged by gaining or losing H⁺.
    where: ["index.mdx#tertiary", "quiz.yaml:q8", "flashcards.yaml:c11", "flashcards.yaml:c13"]
    confidence: high
    basis: IB guide B1.2.9; Berg, Biochemistry
    status: checked
  - id: f23
    claim: Disulfide bonds are common in secreted (extracellular) proteins such as insulin and antibodies, because the cytoplasm is a reducing environment.
    where: ["index.mdx#tertiary"]
    confidence: high
    basis: Alberts, Molecular Biology of the Cell
    status: checked
  - id: f24
    claim: Transmembrane α-helices are typically about 20 (roughly 18–25) mostly hydrophobic amino acids, enough to span the ~3 nm hydrophobic core.
    where: ["index.mdx#polarity", "quiz.yaml:q9", "flashcards.yaml:c14"]
    confidence: high
    basis: Alberts, Molecular Biology of the Cell
    status: checked
  - id: f25
    claim: Haemoglobin is a tetramer of two α (141 aa) and two β (146 aa) chains, each with a haem group containing Fe²⁺ that binds one O₂ (up to four O₂ per molecule); binding is cooperative. Each subunit has the all-α-helical globin fold.
    where: ["index.mdx#quaternary", "quiz.yaml:q10", "flashcards.yaml:c15", "visuals.yaml:protein/quaternary"]
    confidence: high
    basis: Perutz; Berg, Biochemistry
    status: checked
  - id: f26
    claim: Insulin has an A chain (21 aa) and a B chain (30 aa) linked by two interchain disulfide bonds (A7–B7, A20–B19), with one intrachain bond (A6–A11); it is made as a single chain (proinsulin) from which the C peptide is removed.
    where: ["index.mdx#quaternary", "visuals.yaml:protein/quaternary", "scenes/b1-2-quaternary.ts"]
    confidence: high
    basis: Sanger; UniProt P01308
    status: checked
  - id: f27
    claim: IB treats insulin and collagen as non-conjugated proteins with quaternary structure. Collagen carries a little carbohydrate (glucose–galactose on some hydroxylysines), which some biochemistry texts would count as a glycoprotein; the page says it has no prosthetic group.
    where: ["index.mdx#quaternary", "flashcards.yaml:c15"]
    confidence: medium
    basis: IB guide B1.2.11; Shoulders & Raines (2009) Annu Rev Biochem
    status: open
  - id: f28
    claim: "Collagen: every third residue is glycine (Gly–X–Y, X often proline, Y often hydroxyproline); each chain is a left-handed polyproline-II-type helix; three chains form a right-handed triple helix ~300 nm long and ~1.5 nm wide; type I collagen is two α1 chains and one α2 chain; molecules are cross-linked into fibrils; it is the most abundant protein in mammals."
    where: ["index.mdx#form-function", "quiz.yaml:q6", "flashcards.yaml:c16", "visuals.yaml:protein/quaternary", "scenes/b1-2-quaternary.ts"]
    confidence: high
