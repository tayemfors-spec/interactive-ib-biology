cards:
  - id: c1
    level: SL
    front: Cytokinesis in animal cells vs plant cells
    back: Animal — a contractile ring of actin and myosin pinches the plasma membrane inwards (cleavage furrow). Plant — vesicles fuse at the equator to form a cell plate, which becomes the new plasma membranes and cell wall.
  - id: c2
    level: SL
    front: Give two examples of unequal cytokinesis.
    back: Oogenesis in humans (a large egg cell and tiny polar bodies) and budding in yeast (a small bud separates from a larger parent cell).
  - id: c3
    level: SL
    front: Why must every daughter cell receive at least one mitochondrion?
    back: Mitochondria (and chloroplasts) can only be made by the growth and division of existing ones, so a cell without any could never make them.
  - id: c4
    level: SL
    front: Why must the nucleus divide before the cell divides?
    back: So that each daughter cell receives a nucleus. A cell without a nucleus (anucleate) cannot make new proteins or divide.
  - id: c5
    level: SL
    front: What is a chromosome made of after DNA replication?
    back: Two sister chromatids — identical DNA molecules — held together at the centromere until anaphase.
  - id: c6
    level: SL
    front: How do chromosomes condense, and why?
    back: DNA winds around histones (nucleosomes) and is then supercoiled repeatedly. Short, thick chromosomes can be moved and separated without tangling or breaking.
  - id: c7
    level: SL
    front: Name the four phases of mitosis in order, with one key event in each.
    back: Prophase — chromosomes condense, nuclear membrane breaks down, spindle forms. Metaphase — chromosomes line up on the equator. Anaphase — sister chromatids separate to opposite poles. Telophase — nuclear membranes re-form, chromosomes decondense.
  - id: c8
    level: SL
    front: Why are the two nuclei produced by mitosis genetically identical?
    back: The sister chromatids are identical copies, and in anaphase one chromatid of every chromosome goes to each pole, so each nucleus gets the same complete set.
  - id: c9
    level: SL
    front: Diploid vs haploid (with human numbers)
    back: Diploid (2n) — two of each type of chromosome, in homologous pairs; humans 2n = 46. Haploid (n) — one of each type; human gametes n = 23.
  - id: c10
    level: SL
    front: What separates in meiosis I, and what in meiosis II?
    back: Meiosis I — homologous chromosomes separate (halving the chromosome number). Meiosis II — sister chromatids separate.
  - id: c11
    level: SL
    front: Why is meiosis needed in a sexual life cycle?
    back: It halves the chromosome number, so that when two haploid gametes fuse at fertilization the diploid number is restored instead of doubling each generation.
  - id: c12
    level: SL
    front: What is non-disjunction, and how does it cause Down syndrome?
    back: Failure of homologues (anaphase I) or sister chromatids (anaphase II) to separate. An egg with two copies of chromosome 21 fertilized by a normal sperm gives a zygote with three copies (trisomy 21, 47 chromosomes).
  - id: c13
    level: SL
    front: Two ways meiosis produces genetic variation
    back: Random orientation of bivalents in metaphase I (2ⁿ combinations of chromosomes) and crossing over between non-sister chromatids in prophase I (new combinations of alleles on a chromosome).
  - id: c14
    level: AHL
    front: Give the stages of the cell cycle in order.
    back: G1 (growth), S (DNA replication), G2 (growth and preparation) — together interphase — then mitosis, then cytokinesis. Cells that stop dividing enter G0.
  - id: c15
    level: AHL
    front: How do cyclins control the cell cycle?
    back: Cyclin concentrations rise and fall during the cycle. A threshold level of a specific cyclin, which activates a cyclin-dependent kinase, is needed to pass each checkpoint.
  - id: c16
    level: AHL
    front: Proto-oncogene vs tumour suppressor gene
    back: Proto-oncogenes stimulate division; mutation can make an overactive oncogene. Tumour suppressor genes (such as the gene for p53) stop the cycle when conditions are wrong; mutations that inactivate them remove this brake.
  - id: c17
    level: AHL
    front: Benign vs malignant tumour
    back: Benign — slow-growing, stays in one place, does not invade or spread, not a cancer. Malignant — grows fast, invades neighbouring tissue and can metastasize to form secondary tumours; a cancer.
  - id: c18
    level: AHL
    front: How is the mitotic index calculated?
    back: Number of cells in mitosis (prophase to telophase) ÷ total number of cells counted. A high index shows rapid proliferation, for example in a meristem or an aggressive tumour.
