cards:
  - id: c1
    level: SL
    front: Give three adaptations of capillaries for exchange.
    back: Branching networks and narrow diameter give a very large surface area; a wall one thin endothelial cell thick (short diffusion distance) with pores between cells; and, in fenestrated capillaries (e.g. kidney glomerulus, intestinal villi, endocrine glands), extra pores through the cells for very rapid exchange.
  - id: c2
    level: SL
    front: How do you tell an artery from a vein in a micrograph?
    back: Compare wall thickness with lumen diameter. Artery - thick wall, narrow round lumen, thick tunica media, often a folded lining. Vein - thin wall, wide and often flattened lumen, thin tunica media.
  - id: c3
    level: SL
    front: How do the elastic and collagen fibres in artery walls help with high pressure?
    back: Elastic fibres are stretched by each surge of blood in systole and recoil in diastole, pushing blood on and keeping pressure up between beats (about 80 mmHg). Collagen fibres are strong in tension and stop the artery bulging or bursting.
  - id: c4
    level: SL
    front: How do you measure heart rate from the pulse?
    back: Place the index and middle fingertips on the radial pulse (wrist, thumb side) or carotid pulse (neck, beside the windpipe), count beats for 15 s and multiply by 4 (or 30 s × 2). Repeat and take a mean.
  - id: c5
    level: SL
    front: Two adaptations of veins for returning blood to the heart
    back: Pocket valves close if blood starts to flow backwards; thin, flexible walls let contracting skeletal muscles squeeze the vein, pushing blood towards the heart.
  - id: c6
    level: SL
    front: Causes and consequences of coronary artery occlusion
    back: Plaque (atheroma) builds up in the artery wall and narrows the lumen; a clot can form on a ruptured plaque and block it. Cardiac muscle beyond gets no oxygen and dies - a myocardial infarction (heart attack). Narrowing alone can cause angina.
  - id: c7
    level: SL
    front: What does a correlation coefficient tell you, and what can it not show?
    back: Its sign shows whether the correlation is positive or negative and its size (0 to 1) how strong it is. Even a strong correlation does not prove that one variable causes the other, because of confounding variables.
  - id: c8
    level: SL
    front: Explain the transpiration pull in four steps.
    back: Water evaporates from leaf cell walls and diffuses out of stomata; capillary action draws water through cell walls from the xylem; this creates tension (negative pressure) in the xylem; cohesion transmits the tension down the continuous water column to the roots.
  - id: c9
    level: SL
    front: Four adaptations of xylem vessels
    back: No cell contents (dead, empty tubes); no or incomplete end walls (unimpeded flow); lignified walls (resist collapse under tension); pits (water enters and leaves).
  - id: c10
    level: SL
    front: Positions of xylem and phloem in a dicot stem vs root
    back: Stem - vascular bundles in a ring near the outside, phloem outside and xylem inside each bundle, cambium between, pith in the centre. Root - central xylem shaped like a star or cross, with phloem between the arms, inside the endodermis.
  - id: c11
    level: AHL
    front: How is tissue fluid formed and reabsorbed?
    back: High blood pressure at the arteriole end forces plasma out through the capillary wall (pressure filtration), leaving cells and most proteins behind. At the venule end pressure is lower, and fluid drains back in, drawn by the plasma proteins retained in the blood.
  - id: c12
    level: AHL
    front: Plasma vs tissue fluid
    back: Tissue fluid has similar concentrations of water, ions, glucose and amino acids but very little protein and no red blood cells or platelets. Leaving the tissues it has less O₂ and nutrients and more CO₂ and urea.
  - id: c13
    level: AHL
    front: How is excess tissue fluid returned to the blood?
    back: It enters blind-ended lymph capillaries through gaps in their thin walls and flows as lymph through lymph ducts with valves, which empty into veins near the heart.
  - id: c14
    level: AHL
    front: Single vs double circulation
    back: Fish - heart → gills → body → heart (blood passes through the heart once per circuit; low pressure after the gills). Mammal - right side → lungs → left side → body → right side (twice per circuit; separate low-pressure pulmonary and high-pressure systemic circulations).
  - id: c15
    level: AHL
    front: Why is the wall of the left ventricle thicker than that of the right ventricle?
    back: The left ventricle must generate a much higher pressure to pump blood through the aorta to all the organs of the body. The right ventricle pumps only to the nearby lungs at lower pressure, which also protects the delicate alveolar capillaries.
  - id: c16
    level: AHL
    front: Events on the left side of the heart in one cardiac cycle
    back: SAN fires; atrial systole tops up the ventricle through the open bicuspid valve. Ventricular systole - bicuspid valve closes, then aortic valve opens and blood is ejected. Diastole - aortic valve closes, then bicuspid valve opens and the ventricle refills.
  - id: c17
    level: AHL
    front: How is root pressure generated, and when is it needed?
    back: Root cells actively transport mineral ions into the xylem; water follows by osmosis, creating a positive pressure that pushes sap up. It is needed when transpiration is too slow, e.g. in very humid air or in spring before deciduous plants have leaves.
  - id: c18
    level: AHL
    front: How do companion cells and sieve tubes work together in translocation?
    back: Companion cells (nucleus, many mitochondria) actively load sucrose, which passes through plasmodesmata into sieve tubes. Water follows by osmosis, raising pressure; sap flows through sieve plates (in cells with no nucleus and little cytoplasm) to sinks, where sucrose is unloaded.
